[project]
name = "care_demo_facility_setup"
version = "0.1.0"
description = "This plug helps setup a demo facility with a hel"
readme = "README.md"
authors = [
  {name = "Open Health Care Network", email = "support@ohc.network"}
]
maintainers = [
  {name = "Open Health Care Network", email = "support@ohc.network"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
    "django",
    "celery",
    "djangorestframework",
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "ruff",  # linting
]

[project.urls]
bugs = "https://github.com/ohcnetwork/care_demo_facility_setup/issues"
changelog = "https://github.com/ohcnetwork/care_demo_facility_setup/blob/master/changelog.md"
homepage = "https://github.com/ohcnetwork/care_demo_facility_setup"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true

[tool.setuptools.package-data]
care_demo_facility_setup = [
  "data/*.csv",
  "seed_packs/**/*.json",
]
